<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员接口测试</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    label { display: block; margin-top: 10px; }
    input { padding: 5px; width: 300px; }
    button { margin-top: 15px; padding: 6px 12px; }
    pre { background: #f4f4f4; padding: 10px; border: 1px solid #ccc; max-width: 600px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>管理员接口测试</h1>

  <label>
    后端地址:
    <input type="text" id="backendUrl" placeholder="例如 http://localhost:3000" value="http://localhost:3000">
  </label>

  <form id="loginForm">
    <label>用户名:
      <input type="text" id="username" required>
    </label>
    <label>密码:
      <input type="password" id="password" required>
    </label>
    <button type="submit">登录并获取资料</button>
  </form>

  <h2>响应结果:</h2>
  <pre id="responseOutput">等待请求...</pre>

  <script>
    const form = document.getElementById('loginForm');
    const output = document.getElementById('responseOutput');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const backendUrl = document.getElementById('backendUrl').value.trim();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!backendUrl) {
        output.textContent = "请填写后端地址！";
        return;
      }

      try {
        // 登录请求
        const loginResponse = await fetch(`${backendUrl}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const loginData = await loginResponse.json();

        if (loginResponse.ok && loginData.token) {
          output.textContent = "登录成功！\n\n登录响应:\n" + JSON.stringify(loginData, null, 2);

          // 使用 token 获取管理员资料
          const profileResponse = await fetch(`${backendUrl}/api/admin/profile`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${loginData.token}` }
          });

          const profileData = await profileResponse.json();
          output.textContent += "\n\n管理员资料:\n" + JSON.stringify(profileData, null, 2);

        } else {
          output.textContent = "登录失败:\n" + JSON.stringify(loginData, null, 2);
        }

      } catch (err) {
        output.textContent = `请求失败: ${err}\n\n请确保后端已启动且允许访问。`;
      }
    });
  </script>
</body>
</html>
